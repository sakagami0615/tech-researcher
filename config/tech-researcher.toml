# Zenn の新着はトピック別（1回で20件しか載らない取りこぼしは受け入れる。D-12）。
# トピック名を足すと、id「zenn-{トピック}」・表示名「Zenn（{トピック}）」の新着のフィードになる
[sources.zenn]
topics = ["llm", "ai", "aws"]

# Zenn のトレンド（人気）
[[feeds]]
id = "zenn-trend"
display_name = "Zenn（トレンド）"
url = "https://zenn.dev/feed"
kind = "popular"
enabled = true
full_text = "none"

# Qiita の新着は API で取る（後の Issue）
[[feeds]]
id = "qiita-popular"
display_name = "Qiita（人気）"
url = "https://qiita.com/popular-items/feed"
kind = "popular"
enabled = true
full_text = "none" # content は先頭の抜粋

# はてなブックマークは人気だけ使う（D-11）
[[feeds]]
id = "hatena-it"
display_name = "はてなブックマーク（テクノロジー）"
url = "https://b.hatena.ne.jp/hotentry/it.rss"
kind = "popular"
enabled = true
full_text = "none" # content ははてなの埋め込み用の HTML
entry_date = "posted" # dc:date は最初のブックマークの日時（D-13）

# 上限（D-21、structure.md 6章）。運用で調整する
[limits]
http_connect_timeout_s = 10
http_read_timeout_s = 30
http_retry_waits_s = [5, 20] # 再試行2回。それぞれの前に待つ秒数
retry_after_max_s = 60       # Retry-After に従う上限
last30days_timeout_s = 300   # 内部の上限（約171秒）より長くする
last30days_retries = 1
github_rest_calls = 1500
github_search_calls = 100
github_search_per_minute = 25
github_graphql_calls = 50
github_graphql_batch = 100
github_write_calls = 20
qiita_calls = 30
# ⑤ の GitHub への書き込みと Projects の登録は、HTTP の上限（応答30秒・再試行2回）を使う
# ② の再試行の回数と agent の呼び出し回数は、それを実装する Issue で足す
# agent_max_turns =           # 値は PoC で決める

[limits.daily]
collect_minutes = 20
collect_per_source_minutes = 10
analyze_minutes = 20 # 再試行を含めた合計
verify_minutes = 2
investigate_minutes = 8
post_minutes = 5
job_minutes = 60
agent_input_bytes = 2_000_000

[limits.weekly]
collect_minutes = 25
collect_per_source_minutes = 10
analyze_minutes = 40
verify_minutes = 3
investigate_minutes = 10
post_minutes = 5
job_minutes = 90
agent_input_bytes = 8_000_000

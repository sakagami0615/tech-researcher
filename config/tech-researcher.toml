# tech-researcher の設定（D-20）。秘匿情報・投稿先・Projects の指定は書かない（worker.env に置く）。
# 情報源の具体的な値は、それぞれの情報源を実装する Issue で足す。

[daily]
period_days = 1 # 対象期間の長さ。終わりは実行日の 0:00（JST）、始まりはその N 日前

[weekly]
period_days = 7 # 終わりは実行日以前で最も近い月曜の 0:00（JST）。D-17

# RSS・Atom（D-11）。kind は new（新着）か popular（人気型。D-13）。
# 省略できる項目と既定値：
#   full_text = "content"     全文が入る欄。content・summary・none（全文なし）
#   excerpt = "summary"       抜粋にする欄。content・summary。full_text と同じ欄は書けない。同じ内容なら持たない
#   entry_date = "published"  公開日時にする欄。updated（published のない Atom）か、posted（updated を投稿日時とし、公開日時は不明）
#   pages = 1                 WordPress のページ送り（?paged=N）で取るページ数。1〜5
# 公式ブログ（17本）
[[feeds]]
id = "openai"
display_name = "OpenAI"
url = "https://openai.com/news/rss.xml"
kind = "new"
enabled = true
full_text = "none"

[[feeds]]
id = "google-ai"
display_name = "Google（AI）"
url = "https://blog.google/innovation-and-ai/technology/ai/rss/"
kind = "new"
enabled = true
full_text = "none"
excerpt = "content" # summary は画像の説明文

[[feeds]]
id = "deepmind"
display_name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
kind = "new"
enabled = true
full_text = "none"

[[feeds]]
id = "google-research"
display_name = "Google Research"
url = "https://research.google/blog/rss/"

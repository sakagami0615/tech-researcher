[project]
name = "tech-researcher"
version = "0.1.0"
description = "技術情報を集めて日次・週次レポートを GitHub Issue に公開するツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 実際の AI（llm）と外部への通信（network）を使うテストは、既定では流さない（D-23）
addopts = "-m 'not llm and not network' --strict-markers --import-mode=importlib"
markers = [
    "llm: 実際の AI を呼ぶ回帰テスト。運用者が手で流す",
    "network: 外部と通信するテスト。手で流す",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

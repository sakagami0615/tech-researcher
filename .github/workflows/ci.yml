name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ランナーのシステムの Python（ubuntu-latest に入った 3.14.4 など）を使わず、uv の管理する
    # Python を使う。ビルドでスタックの大きさが違い、深い入れ子の JSON の扱い（RecursionError）が
    # 変わるため（2026-11-21 に test_github_api で確認）
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.0"
      - name: 依存を入れる
        run: uv sync --locked
      - name: 整形の確認
        run: uv run ruff format --check
      - name: 静的検査
        run: uv run ruff check
      # 単体テストと、記録した出力による契約テスト。llm と network は pyproject.toml の設定で外れる
      - name: テスト
        run: uv run pytest
